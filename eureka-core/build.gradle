dependencies {
    implementation project(':eureka-client')

    implementation "com.amazonaws:aws-java-sdk-core:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-ec2:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-autoscaling:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-sts:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-route53:${awsVersion}"
    implementation "javax.servlet:servlet-api:${servletVersion}"
    implementation 'com.thoughtworks.xstream:xstream:1.4.19'
    implementation 'javax.ws.rs:jsr311-api:1.1.1'

    implementation "com.sun.jersey:jersey-core:${jerseyVersion}"
    implementation "com.sun.jersey:jersey-client:${jerseyVersion}"
    implementation "com.netflix.servo:servo-core:${servoVersion}"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation "com.netflix.archaius:archaius-core:${archaiusVersion}"
    implementation 'javax.ws.rs:jsr311-api:1.1.1'
    implementation "com.sun.jersey.contribs:jersey-apache-client4:${jerseyVersion}"
    implementation "com.google.inject:guice:${guiceVersion}"
    implementation 'commons-configuration:commons-configuration:1.10'

    // These dependencies are marked 'compileOnly' in the client, but we need them always on the server
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
    implementation "com.fasterxml.woodstox:woodstox-core:${woodstoxVersion}"

    testImplementation project(':eureka-test-utils')
    testImplementation "junit:junit:${junit_version}"
    testImplementation 'org.mortbay.jetty:jetty:6.1H.22'
    testImplementation "org.mock-server:mockserver-netty:${mockserverVersion}"
    testImplementation "com.jcraft:jzlib:1.1.3" // netty dependency
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation 'org.slf4j:slf4j-simple:1.7.10'

    implementation "edu.ucr.cs.riple.annotator:annotation-util:1.3.16-SNAPSHOT"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "com.uber.nullaway:nullaway-annotations:0.12.4-SNAPSHOT"
}
